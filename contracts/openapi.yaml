openapi: 3.1.0
info:
  title: Signa API
  version: 0.1.0
  description: Canonical HTTP contract between the Signa Go backend and TypeScript frontend.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check API health
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /reports:
    post:
      operationId: createReport
      summary: Accept a text-first report
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '202':
          description: Report accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAcknowledgement'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
          description: Health status returned by the API.
    Report:
      type: object
      description: Report state returned by the backend; exact device coordinates are never returned here.
      properties:
        id:
          type: string
        reporter_id:
          type: [string, 'null']
        incident_id:
          type: [string, 'null']
        raw_text:
          type: string
        normalized_text:
          type: [string, 'null']
        source_type:
          type: [string, 'null']
        eyewitness_claim:
          type: [string, 'null']
        claimed_location:
          anyOf:
            - $ref: '#/components/schemas/ReportLocation'
            - type: 'null'
        observed_at:
          type: [string, 'null']
          format: date-time
        submitted_at:
          type: string
          format: date-time
        device_location:
          anyOf:
            - $ref: '#/components/schemas/ReportLocation'
            - type: 'null'
        location_accuracy:
          type: [number, 'null']
        language:
          type: [string, 'null']
        evidence_state:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    CreateReportRequest:
      type: object
      required:
        - raw_text
      additionalProperties: false
      properties:
        raw_text:
          type: string
          minLength: 1
          description: Text of the report; surrounding whitespace is ignored for validation.
        device_location:
          anyOf:
            - $ref: '#/components/schemas/DeviceLocation'
            - type: 'null'
    DeviceLocation:
      type: object
      required:
        - latitude
        - longitude
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy:
          type: number
          minimum: 0
    ReportAcknowledgement:
      type: object
      required:
        - report_id
        - status
        - submitted_at
      properties:
        report_id:
          type: string
        status:
          type: string
          const: accepted
        submitted_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    ReportLocation:
      type: object
      description: Location associated with a report; exact retention and public precision remain policy decisions.
      properties:
        latitude:
          type: number
        longitude:
          type: number
