services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: signa
      POSTGRES_USER: signa
      POSTGRES_PASSWORD: signa_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - signa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signa -d signa"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  signa_postgres_data:
